name: Apply fitness template gallery update

on:
  push:
    branches:
      - feat/feature-fitness-template-gallery

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update landing template gallery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('buynow/src/app/App.tsx')
          text = path.read_text()

          text = text.replace(
              'type LandingTemplateKey = "hero" | "consultation" | "creator-brand" | "local";',
              'type LandingTemplateKey = "fitness-coach" | "hero" | "consultation" | "launch" | "creator-brand" | "local";'
          )

          text = text.replace(
              '  colors: [string, string];\n};',
              '  colors: [string, string];\n  previewImage?: string;\n};',
              1
          )

          fitness = '''  {\n    key: "fitness-coach",\n    name: "Fitness Coach",\n    category: "Lead Generation · Coaching",\n    headline: "Get stronger, leaner, and more confident.",\n    description: "A conversion-focused fitness coaching page built to turn social traffic into applications with a VSL, transformation proof, and one clear CTA.",\n    ctaLabel: "Apply for Coaching",\n    highlights: ["VSL section", "Before & after proof", "Application form"],\n    colors: ["#111111", "#D7263D"],\n    previewImage: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=900&q=85",\n  },\n'''
          marker = 'const LANDING_TEMPLATES: LandingTemplate[] = [\n'
          if 'key: "fitness-coach"' not in text:
              text = text.replace(marker, marker + fitness, 1)

          text = text.replace(
              'const [selectedTemplateKey, setSelectedTemplateKey] = useState<LandingTemplateKey>("hero");',
              'const [selectedTemplateKey, setSelectedTemplateKey] = useState<LandingTemplateKey>("fitness-coach");'
          )

          old_card = '''<div className="relative h-24 w-[104px] flex-shrink-0 overflow-hidden rounded-[18px]"\n                    style={{ background: `linear-gradient(135deg, ${template.colors[0]}, ${template.colors[1]})` }}>\n                    <div className="absolute left-3 top-3 h-1.5 w-8 rounded-full bg-white/40" />\n                    <div className="absolute inset-x-3 top-8 h-2 rounded-full bg-white/82" />\n                    <div className="absolute inset-x-3 top-12 h-2 rounded-full bg-white/62" />\n                    <div className="absolute bottom-3 left-3 right-3 h-7 rounded-xl bg-white/92" />\n                  </div>'''
          new_card = '''<div\n                    className="relative h-28 w-[116px] flex-shrink-0 overflow-hidden rounded-[18px] bg-cover bg-center"\n                    style={{\n                      backgroundImage: template.previewImage\n                        ? `linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.55)), url(${template.previewImage})`\n                        : `linear-gradient(135deg, ${template.colors[0]}, ${template.colors[1]})`,\n                    }}\n                  >\n                    <div className="absolute inset-x-3 top-3 flex items-center justify-between">\n                      <span className="rounded-full bg-black/45 px-2 py-1 text-[9px] font-bold text-white">\n                        {template.key === "fitness-coach" ? "FEATURED" : "TEMPLATE"}\n                      </span>\n                    </div>\n                    <div className="absolute inset-x-3 bottom-3">\n                      <div className="h-1.5 w-14 rounded-full bg-white/90" />\n                      <div className="mt-1.5 h-1.5 w-20 rounded-full bg-white/60" />\n                    </div>\n                  </div>'''
          if old_card in text:
              text = text.replace(old_card, new_card, 1)

          start = text.index('  const useLandingTemplate = async')
          end = text.index('  const saveProductDraft = async', start)
          section_block = '''      sections: templateKey === "fitness-coach"\n        ? [\n            {\n              type: "hero",\n              template: template.key,\n              headline: template.headline,\n              description: template.description,\n              ctaLabel: template.ctaLabel,\n              colors: template.colors,\n              image: {\n                assetId: "fitness-coach-hero",\n                src: template.previewImage,\n                alt: "Fitness coach training in a gym",\n              },\n            },\n            {\n              type: "video",\n              title: "Watch the VSL",\n              description: "See how the coaching program works and what makes the approach different.",\n              videoUrl: "https://www.youtube.com/watch?v=dQw4w9WgXcQ",\n              ctaLabel: "Watch the VSL",\n            },\n            {\n              type: "form",\n              layout: "inline",\n              formId: selectedLandingForm?._id ?? null,\n              formName: selectedLandingForm?.name ?? null,\n              formSlug: selectedLandingForm?.slug ?? null,\n              ctaLabel: "Apply for Coaching",\n              formLink: selectedLandingForm?.publishSettings?.path ?? null,\n            },\n            {\n              type: "before-after",\n              title: "Real people. Real transformations.",\n              items: [\n                {\n                  beforeImage: "https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=900&q=85",\n                  afterImage: "https://images.unsplash.com/photo-1538805060514-97d9cc17730c?auto=format&fit=crop&w=900&q=85",\n                  name: "Client Transformation",\n                  quote: "I finally have a plan I can stick to and the confidence to keep going.",\n                },\n              ],\n            },\n            {\n              type: "highlights",\n              items: ["Personalized training", "Nutrition guidance", "Weekly accountability", "Coach support"],\n            },\n            {\n              type: "faq",\n              items: [\n                { question: "Do I need a gym?", answer: "No. Your plan can be adapted to your equipment and schedule." },\n                { question: "How does coaching work?", answer: "You receive a personalized plan, ongoing support, and regular progress check-ins." },\n                { question: "Who is this for?", answer: "It is designed for busy adults who want a sustainable approach to getting stronger and leaner." },\n              ],\n            },\n            {\n              type: "cta",\n              headline: "Ready to start your transformation?",\n              ctaLabel: "Apply for Coaching",\n              formLink: selectedLandingForm?.publishSettings?.path ?? null,\n            },\n          ]\n        : [\n            {\n              type: "hero",\n              template: template.key,\n              headline: template.headline,\n              description: template.description,\n              ctaLabel: template.ctaLabel,\n              colors: template.colors,\n            },\n            {\n              type: "form",\n              layout: "inline",\n              formId: selectedLandingForm?._id ?? null,\n              formName: selectedLandingForm?.name ?? null,\n              formSlug: selectedLandingForm?.slug ?? null,\n              ctaLabel: selectedLandingForm ? "Submit" : "Create a form",\n            },\n            {\n              type: "highlights",\n              items: template.highlights,\n            },\n          ],\n'''
          region = text[start:end]
          region_new = re.sub(r'      sections: \[.*?\n      \],\n', section_block, region, count=1, flags=re.S)
          if region_new == region:
              raise SystemExit('Could not locate landing page sections block')
          text = text[:start] + region_new + text[end:]

          path.write_text(text)
          PY

      - name: Validate TypeScript syntax
        working-directory: buynow
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit

      - name: Commit application changes and remove helper workflow
        run: |
          rm -f .github/workflows/apply-fitness-template-gallery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add buynow/src/app/App.tsx .github/workflows/apply-fitness-template-gallery.yml
          git commit -m "feat: feature fitness coach landing template" || exit 0
          git push origin HEAD:feat/feature-fitness-template-gallery
